name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install UV
        run: pip install uv
      - name: Install Dependencies
        run: |
          uv venv
          uv pip install -e .
          uv pip install pytest
      - name: Run tests
        run: uv run pytest tests/
      # - name: Build Docker image
      #   run: docker build -t student-score-api .
